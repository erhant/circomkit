name: tests

on:
  push:
    branches:
      - main
    paths:
      # Source files
      - 'src/**'
      - 'tests/**'
      # Configurations
      - 'circomkit.json'
      - 'hardhat.config.ts'
      - 'vitest.config.mts'
      # workflow itself
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # oldest supported & latest
        circom: ['2.1.5', '2.2.3']

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libgmp-dev \
            libsodium-dev \
            nasm \
            nlohmann-json3-dev

      - name: Download Circom Binary v${{ matrix.circom }}
        run: |
          wget -qO /home/runner/work/circom https://github.com/iden3/circom/releases/download/v${{ matrix.circom }}/circom-linux-amd64
          chmod +x /home/runner/work/circom
          sudo mv /home/runner/work/circom /bin/circom

      - name: Print Circom version
        run: circom --version

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Run tests with Bun
        run: pnpm test:bun
