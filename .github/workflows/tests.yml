name: tests

on:
  push:
    branches:
      - main
    paths:
      # Source files
      - 'src/**'
      - 'tests/**'
      # Configurations
      - 'circomkit.json'
      - 'vitest.config.mts'
      # workflow itself
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the oldest & the newest of what we support, paired instead of all combinations
        include:
          - name: oldest
            circom: '2.1.5'
            node: 22
            snarkjs: '0.7.5'
          - name: newest
            circom: '2.2.3'
            node: 26
            snarkjs: 'latest'
    name: test (${{ matrix.name }}, circom ${{ matrix.circom }}, node ${{ matrix.node }}, snarkjs ${{ matrix.snarkjs }})

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libgmp-dev \
            libsodium-dev \
            nasm \
            nlohmann-json3-dev

      - name: Download Circom Binary v${{ matrix.circom }}
        run: |
          wget -qO /home/runner/work/circom https://github.com/iden3/circom/releases/download/v${{ matrix.circom }}/circom-linux-amd64
          chmod +x /home/runner/work/circom
          sudo mv /home/runner/work/circom /bin/circom

      - name: Print Circom version
        run: circom --version

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # a peer dependency, so its version is chosen by the users
      - name: Use snarkjs ${{ matrix.snarkjs }}
        run: |
          pnpm add --save-dev snarkjs@${{ matrix.snarkjs }}
          pnpm list snarkjs

      - name: Run tests
        run: pnpm test

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Run tests with Bun
        run: pnpm test:bun
