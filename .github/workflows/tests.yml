name: tests

on:
  push:
    branches:
      - main
    paths:
      # Source files
      - 'src/**'
      - 'tests/**'
      # Configurations
      - 'circomkit.json'
      - 'vitest.config.mts'
      # workflow itself
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # the oldest & the newest of what we support, paired instead of all combinations,
        # and the newest on macOS, for the C witness calculator on ARM
        include:
          - name: oldest
            runner: ubuntu-latest # x86-64, with assembly
            circom: '2.1.5'
            node: 22
            snarkjs: '0.7.5'
          - name: newest
            runner: ubuntu-latest
            circom: '2.2.3'
            node: 26
            snarkjs: 'latest'
          - name: macos
            runner: macos-15 # Apple Silicon, with `--no_asm` that needs Circom 2.2.2 or newer
            circom: '2.2.3'
            node: 26
            snarkjs: 'latest'
        # left out: Windows, as Circom's C code needs POSIX headers such as `sys/mman.h`,
        # and ARM Linux & Intel macOS, as Circom has no binaries for them
    name: test (${{ matrix.name }}, circom ${{ matrix.circom }}, node ${{ matrix.node }}, snarkjs ${{ matrix.snarkjs }})

    steps:
      - uses: actions/checkout@v4

      # for the C witness calculator, as in the README
      - name: Install C dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libgmp-dev nlohmann-json3-dev nasm

      # Circomkit finds Homebrew's headers & libraries itself
      - name: Install C dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install gmp nlohmann-json

      # despite its name, the macOS binary is built for arm64
      - name: Install Circom v${{ matrix.circom }}
        run: |
          sudo curl -fsSL -o /usr/local/bin/circom \
            https://github.com/iden3/circom/releases/download/v${{ matrix.circom }}/circom-${{ runner.os == 'macOS' && 'macos' || 'linux' }}-amd64
          sudo chmod +x /usr/local/bin/circom

      - name: Print versions
        run: |
          circom --version
          uname -m

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # a peer dependency, so its version is chosen by the users
      - name: Use snarkjs ${{ matrix.snarkjs }}
        run: |
          pnpm add --save-dev snarkjs@${{ matrix.snarkjs }}
          pnpm list snarkjs

      - name: Run tests
        run: pnpm test

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Run tests with Bun
        run: pnpm test:bun
