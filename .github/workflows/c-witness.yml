name: c-witness

# the C witness calculator, with the setup from the README, on each platform that Circom releases a binary for
# manual only, and on PRs that change this workflow
on:
  workflow_dispatch:
    inputs:
      circom:
        description: 'Circom version, 2.2.2 or newer for `--no_asm` on ARM'
        default: '2.2.3'
  pull_request:
    paths:
      - '.github/workflows/c-witness.yml'

env:
  CIRCOM_VERSION: ${{ inputs.circom || '2.2.3' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04 # x86-64, with assembly
            circom: circom-linux-amd64
          - runner: macos-15 # Apple Silicon, with `--no_asm`
            circom: circom-macos-amd64 # despite its name, built for arm64
        # left out: Windows, as Circom's C code needs POSIX headers such as `sys/mman.h`,
        # and ARM Linux & Intel macOS, as Circom has no binaries for them
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install C dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libgmp-dev nlohmann-json3-dev nasm

      - name: Install C dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gmp nlohmann-json
          echo "CPATH=$(brew --prefix)/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"

      - name: Install Circom
        run: |
          sudo curl -fsSL -o /usr/local/bin/circom \
            https://github.com/iden3/circom/releases/download/v$CIRCOM_VERSION/${{ matrix.circom }}
          sudo chmod +x /usr/local/bin/circom

      - name: Print versions
        run: |
          circom --version
          uname -m

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # `CI` is set, so the C tests fail instead of being skipped if the C witness calculator can not be built
      - name: Run tests
        run: pnpm test
