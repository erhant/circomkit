[package]
name = "circomkit-napi"
description = "Node.js (napi-rs) bindings for Circomkit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
circomkit.workspace = true
napi.workspace = true
napi-derive.workspace = true
serde_json.workspace = true
num-bigint.workspace = true

[build-dependencies]
napi-build.workspace = true

[features]
default = []
# Native proving backends, forwarded to circomkit.
prove-arkworks = ["circomkit/prove-arkworks"]
prove-lambdaworks = ["circomkit/prove-lambdaworks"]
